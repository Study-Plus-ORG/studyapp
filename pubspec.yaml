name: studyapp
description: "Um aplicativo para a organização do tempo de estudos"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1

  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  english_words: ^4.0.0
  flutter_svg: ^2.3.0
  flutter_decorated_text: ^2.2.0
  flutter_text_decorator: ^0.0.1
  google_fonts: ^8.2.1
  new_gradient_app_bar: ^0.2.0
  splashscreen: ^2.0.0
  flutter_native_splash: ^2.4.7
  syncfusion_flutter_calendar: ^34.2.5
  flutter_countdown_timer: ^4.1.0
  flutter_local_notifications: ^22.3.1
  supabase_flutter: ^2.8.0
  flutter_dotenv: ^6.0.0
  shared_preferences: ^2.5.5
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"


flutter_native_splash:
  color: "FFFFFF"
  image: assets/images/textodoseuparagrafo.png


flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/svgs/
    - assets/images/textodoseuparagrafo.png
